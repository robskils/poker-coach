<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Card background -->
  <rect width="32" height="32" rx="5" fill="#0c1a0c"/>
  <rect x="1" y="1" width="30" height="30" rx="4.5" fill="url(#card)" stroke="rgba(201,168,76,0.4)" stroke-width="0.75"/>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0c1a0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d070"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a07828"/>
    </linearGradient>
  </defs>
  <!-- Gold A -->
  <text x="16" y="20" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="20" fill="url(#gold)">A</text>
  <!-- Spade pip -->
  <text x="16" y="29" text-anchor="middle" font-family="serif" font-size="8" fill="url(#gold)">♠</text>
</svg>
